<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nekoxile - Profile</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        background-color: #ffffff;
        color: #37352f;
        line-height: 1.6;
        padding: 20px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 60px 20px;
      }

      /* ヘッダー部分 */
      .header {
        margin-bottom: 48px;
        padding-bottom: 24px;
        border-bottom: 1px solid rgba(55, 53, 47, 0.09);
      }

      .profile-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        color: white;
        font-weight: 600;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 40px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #37352f;
      }

      .subtitle {
        font-size: 18px;
        color: rgba(55, 53, 47, 0.65);
        margin-bottom: 24px;
      }

      /* セクション */
      .section {
        margin-bottom: 40px;
      }

      .section-title {
        font-size: 16px;
        font-weight: 600;
        color: rgba(55, 53, 47, 0.65);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 16px;
      }

      .section-content {
        padding: 16px;
        background-color: #f7f6f3;
        border-radius: 4px;
        color: #37352f;
      }

      /* スキルセクション */
      .skills-content {
        padding: 16px;
        background-color: #f7f6f3;
        border-radius: 4px;
        font-style: italic;
        color: rgba(55, 53, 47, 0.65);
      }

      /* リンクセクション */
      .links {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .link-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background-color: #f7f6f3;
        border: 1px solid rgba(55, 53, 47, 0.16);
        border-radius: 4px;
        text-decoration: none;
        color: #37352f;
        font-size: 14px;
        font-weight: 500;
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }

      .link-button:hover {
        background-color: rgba(55, 53, 47, 0.08);
        border-color: rgba(55, 53, 47, 0.24);
      }

      .link-icon {
        width: 20px;
        height: 20px;
      }

      /* フッター */
      .footer {
        margin-top: 80px;
        padding-top: 24px;
        border-top: 1px solid rgba(55, 53, 47, 0.09);
        text-align: center;
        font-size: 14px;
        color: rgba(55, 53, 47, 0.45);
      }

      /* レスポンシブ対応 */
      @media (max-width: 768px) {
        .container {
          padding: 40px 16px;
        }

        h1 {
          font-size: 32px;
        }

        .subtitle {
          font-size: 16px;
        }

        .profile-icon {
          width: 64px;
          height: 64px;
          font-size: 28px;
        }
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 28px;
        }

        .section-title {
          font-size: 14px;
        }

        .links {
          flex-direction: column;
        }

        .link-button {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- ヘッダー -->
      <div class="header">
        <div class="profile-icon">N</div>
        <h1>nekoxile</h1>
        <p class="subtitle">インフラエンジニア</p>
      </div>

      <!-- 自己紹介セクション -->
      <div class="section">
        <div class="section-title">About</div>
        <div class="section-content">
          インフラエンジニアとして活動しています。<br />
          日々の学びを記録し、技術を磨いています。
        </div>
      </div>

      <!-- スキルセクション -->
      <div class="section">
        <div class="section-title">Skills</div>
        <div class="skills-content">現在スキルを習得中です</div>
      </div>

      <!-- リンクセクション -->
      <div class="section">
        <div class="section-title">Links</div>
        <div class="links">
          <a
            href="https://github.com/nekoxile"
            target="_blank"
            rel="noopener noreferrer"
            class="link-button"
          >
            <svg class="link-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              />
            </svg>
            GitHub
          </a>
        </div>
      </div>

      <!-- フッター -->
      <div class="footer">© 2025 nekoxile. All rights reserved.</div>
    </div>
  </body>
</html>
